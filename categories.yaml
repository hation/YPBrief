# YPBrief 频道分类主文件（唯一事实源）
#
# 本文件统一管理「分类 → 频道」。修改后运行：
#   .venv/bin/python scripts/sync_categories.py
# 会重新生成 sources.yaml（GitHub Actions 与 Web UI 导入均读取该文件）。
#
# 每个频道可用 importance 字段（可选，默认 normal）：
#   - important : 自动总结并纳入简报
#   - normal    : 只进入筛选/待选，手动触发后总结
#   - low       : 仅标题+链接，不总结
#
# 新增分类：在 categories 下追加一个块；每个分类的简报参数相互独立。

